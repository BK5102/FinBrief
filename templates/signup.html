{% extends "base.html" %}
{% block title %}Sign up — FinBrief{% endblock %}

{% block content %}
  <section class="auth-form">
    <h2>Create your FinBrief account</h2>
    {% if error %}
      <p class="auth-error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/signup">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email or '' }}" required autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
      <label for="password2">Confirm password</label>
      <input id="password2" name="password2" type="password" required autocomplete="new-password" minlength="8" placeholder="Re-enter password">
      <button type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
  </section>
{% endblock %}
