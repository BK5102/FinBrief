{% extends "base.html" %}
{% block title %}Sign up — FinBrief{% endblock %}

{% block content %}
  <div class="auth-wrap">
    <div class="auth-form">
      <h2>Create your account</h2>
      {% if error %}
        <p class="auth-error">{{ error }}</p>
      {% endif %}
      <form method="post" action="/signup">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" value="{{ email or '' }}"
                 required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
        </div>
        <div class="field">
          <label for="password2">Confirm password</label>
          <input id="password2" name="password2" type="password"
                 required autocomplete="new-password" minlength="8" placeholder="Re-enter password">
        </div>
        <button class="submit-btn" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </div>
{% endblock %}
