<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FinBrief{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="/">FinBrief</a>
    <div class="nav-links">
      {% if current_user %}
        <a href="/">Dashboard</a>
        <span class="nav-email meta">{{ current_user.email }}</span>
        <form method="post" action="/logout" class="inline-form">
          <button class="button ghost nav-btn" type="submit">Sign out</button>
        </form>
      {% else %}
        <a href="/login">Log in</a>
        <a class="button nav-btn" href="/signup">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
