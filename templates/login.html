{% extends "base.html" %}
{% block title %}Log in — FinBrief{% endblock %}

{% block content %}
  <section class="auth-form">
    <h2>Log in to FinBrief</h2>
    {% if error %}
      <p class="auth-error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email or '' }}" required autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      <button type="submit">Log in</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
  </section>
{% endblock %}
